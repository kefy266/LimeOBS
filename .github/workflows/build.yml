name: Derleme

# macOS dakikaları private depolarda 10 kat sayıldığı için her push'ta değil,
# yalnızca sürüm etiketi (v1.0.0 gibi) atıldığında veya elle tetiklendiğinde çalışır.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv imagemagick libfuse2t64 desktop-file-utils file \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Python ortamı
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install pyinstaller pillow -r requirements.txt

      - name: appimagetool
        run: |
          mkdir -p tools && cd tools
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null

      - name: AppImage derle
        run: ./build_appimage.sh

      - uses: actions/upload-artifact@v5
        with:
          name: LimeOBS-Linux
          path: dist_appimage/LimeOBS-x86_64.AppImage

  macos:
    name: macOS (.app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python ortamı
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install pyinstaller pillow -r requirements.txt

      - name: .app derle
        run: |
          venv/bin/pyinstaller --noconfirm --clean limeobs.spec
          ditto -c -k --keepParent dist/LimeOBS.app LimeOBS-macOS-arm64.zip

      - name: .dmg oluştur (Uygulamalar kısayollu)
        run: |
          brew install create-dmg
          # 1x ve 2x arka planı Retina uyumlu tek TIFF'te birleştir
          tiffutil -cathidpicheck packaging/macos/dmg-background.png packaging/macos/dmg-background@2x.png -out dmg-bg.tiff
          mkdir dmg-src && cp -R dist/LimeOBS.app dmg-src/
          ARGS=(--volname "LimeOBS" --volicon akbim_frontend/app_icon.icns
                --background dmg-bg.tiff --window-pos 200 120 --window-size 660 428
                --icon-size 112 --icon "LimeOBS.app" 165 185 --hide-extension "LimeOBS.app"
                --app-drop-link 495 185 --hdiutil-retries 10)
          # Finder pencere düzeni AppleScript ile yapılır; CI'da takılırsa düzensiz ama çalışan DMG üret
          if ! perl -e 'alarm shift; exec @ARGV' 300 create-dmg "${ARGS[@]}" LimeOBS-macOS-arm64.dmg dmg-src/; then
            rm -f LimeOBS-macOS-arm64.dmg rw.*.dmg
            create-dmg "${ARGS[@]}" --skip-jenkins LimeOBS-macOS-arm64.dmg dmg-src/
          fi
          hdiutil verify LimeOBS-macOS-arm64.dmg

      - uses: actions/upload-artifact@v5
        with:
          name: LimeOBS-macOS
          path: |
            LimeOBS-macOS-arm64.dmg
            LimeOBS-macOS-arm64.zip

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketleri
        run: pip install pyinstaller pillow -r requirements.txt

      - name: Taşınabilir paket derle
        run: |
          pyinstaller --noconfirm --clean limeobs.spec
          python -c "import shutil; shutil.make_archive('LimeOBS-Windows-Portable', 'zip', 'dist', 'LimeOBS')"

      - uses: actions/upload-artifact@v5
        with:
          name: LimeOBS-Windows
          path: LimeOBS-Windows-Portable.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/LimeOBS-x86_64.AppImage
            out/LimeOBS-macOS-arm64.dmg
            out/LimeOBS-macOS-arm64.zip
            out/LimeOBS-Windows-Portable.zip

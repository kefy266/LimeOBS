name: GitHub Pages Yayınla

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v5

      - name: İndirme Dosyalarını Hazırla
        run: |
          mkdir -p website/downloads
          gh release download v1.0.0 -D website/downloads --repo kefy266/LimeOBS || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pages Ayarlarını Hazırla
        uses: actions/configure-pages@v5

      - name: Website Klasörünü Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4

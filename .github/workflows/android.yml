name: Android APK

on:
  push:
    branches: ["main", "android"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK derle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: İmza anahtarı
        env:
          ANAHTAR_B64: ${{ secrets.LIMEOBS_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANAHTAR_B64" ]; then
            echo "$ANAHTAR_B64" | base64 -d > "$RUNNER_TEMP/limeobs.jks"
            echo "LIMEOBS_KEYSTORE=$RUNNER_TEMP/limeobs.jks" >> "$GITHUB_ENV"
            echo "Sürüm anahtarıyla imzalanacak."
          else
            echo "::warning::LIMEOBS_KEYSTORE_B64 tanımlı değil; APK geçici hata ayıklama anahtarıyla imzalanacak."
          fi

      - name: Sürüm bilgisi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then AD="${GITHUB_REF_NAME#v}"; else AD="1.2.$((GITHUB_RUN_NUMBER - 21))"; fi  # 1.2.0 = 21. derleme
          echo "LIMEOBS_VERSION_NAME=$AD" >> "$GITHUB_ENV"
          echo "LIMEOBS_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Derle
        env:
          LIMEOBS_KEYSTORE_PASS: ${{ secrets.LIMEOBS_KEYSTORE_PASS }}
        run: gradle -p android assembleRelease --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk LimeOBS-Android.apk

      - uses: actions/upload-artifact@v5
        with:
          name: LimeOBS-Android
          path: LimeOBS-Android.apk

      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LimeOBS-Android.apk

      # Doğrudan indirme: her derlemede APK sabit "android-guncel" sürümüne konur (zipsiz, girişsiz link):
      #   https://github.com/<depo>/releases/download/android-guncel/LimeOBS-Android.apk
      # surum.json (uygulama içi otomatik güncelleme) yalnızca sabit imza anahtarıyla yüklenir; farklı
      # anahtarla imzalı APK telefonda güncelleme olarak kurulamayacağı için uygulama boşuna önermesin.
      - name: Doğrudan indirme sürümüne yükle
        if: github.ref == 'refs/heads/android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-guncel >/dev/null 2>&1; then
            gh release create android-guncel --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "LimeOBS Android" \
              --notes "LimeOBS Android uygulamasının en son derlemesi. LimeOBS-Android.apk dosyasını indirip kur."
          fi
          gh release upload android-guncel LimeOBS-Android.apk --clobber
          if [ -n "$LIMEOBS_KEYSTORE" ]; then
            NOT="$(git log -1 --format=%s)"
            jq -n --argjson kod "$LIMEOBS_VERSION_CODE" --arg ad "$LIMEOBS_VERSION_NAME" --arg not "$NOT" \
              --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-guncel/LimeOBS-Android.apk" \
              '{versionCode: $kod, versionName: $ad, notes: $not, apk: $apk}' > surum.json
            gh release upload android-guncel surum.json --clobber
          fi

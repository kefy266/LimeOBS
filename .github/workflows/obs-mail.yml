name: OBS E-posta Bildirimleri

# Saatler UTC'dir (Türkiye = UTC+3). GitHub zamanlanmış işleri yoğunlukta 5-30 dk gecikebilir.
on:
  schedule:
    - cron: "50 5 * * 1-5"        # 08:50 TR, hafta içi: sabah özeti
    - cron: "*/30 5-17 * * 1-5"   # 08:00-20:30 TR, hafta içi her 30 dk: yeni kayıt kontrolü
    - cron: "0 9,15 * * 0,6"      # hafta sonu 12:00 ve 18:00 TR: yeni kayıt kontrolü
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod"
        type: choice
        options: [test, digest, check]
        default: test

permissions:
  contents: read

concurrency:
  group: obs-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install --quiet requests beautifulsoup4 pypdf "urllib3<3"

      - name: Mod
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 5 * * 1-5" ]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=check" >> "$GITHUB_OUTPUT"
          fi

      # Görülen kayıt listesi depoya değil (depo herkese açık), Actions önbelleğine yazılır
      - name: Önceki durumu yükle
        if: steps.mode.outputs.mode == 'check'
        uses: actions/cache/restore@v4
        with:
          path: .obs_mailer_state.json
          key: obs-mailer-state-${{ github.run_id }}
          restore-keys: obs-mailer-state-

      - name: Çalıştır
        env:
          OBS_TC: ${{ secrets.OBS_TC }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STATE_FILE: .obs_mailer_state.json
        run: python scripts/obs_mailer.py "${{ steps.mode.outputs.mode }}"

      - name: Durumu kaydet
        if: steps.mode.outputs.mode == 'check'
        uses: actions/cache/save@v4
        with:
          path: .obs_mailer_state.json
          key: obs-mailer-state-${{ github.run_id }}
